services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postventa
      POSTGRES_USER: postventa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - postventa-data:/var/lib/postgresql/data
      - ./shared-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postventa -d postventa"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: postventa
      DATABASE_USER: postventa
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      FRONTEND_ORIGIN: http://localhost:${POSTVENTA_WEB_PORT:-5173}
      PORT: 3000
      POSTVENTA_DEMO_DATA: "true"
    volumes:
      - ./shared-schema.sql:/shared-schema.sql:ro
    command: ["sh", "-c", "node dist/database/demo-runner.js prepare && node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js && node dist/database/demo-runner.js seed && node dist/main.js"]
    ports:
      - "127.0.0.1:${POSTVENTA_API_PORT:-3001}:3000"
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${POSTVENTA_API_PORT:-3001}
    ports:
      - "127.0.0.1:${POSTVENTA_WEB_PORT:-5173}:5173"
    depends_on:
      - backend
volumes:
  postventa-data:
